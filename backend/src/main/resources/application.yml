server:
  port: 8080

spring:
  application:
    name: equipment-management
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/equipment_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 105419
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: equipment-management-jwt-secret-key-change-in-production
  expiration: 86400000
  refresh-grace-period: 604800000

auth:
  login:
    max-failures: 5
    lock-duration-minutes: 30

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: equipment

file:
  upload:
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp,pdf,doc,docx,txt,xls,xlsx
    max-size: 52428800
    categories:
      image: jpg,jpeg,png,gif,webp,bmp
      document: pdf,doc,docx,txt
      excel: xls,xlsx
      contract: pdf,doc,docx
